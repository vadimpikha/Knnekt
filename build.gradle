buildscript {

    ext.project_min_sdk = 21
    ext.project_compile_sdk = 30
    ext.project_target_sdk = 30
    ext.project_build_tools_version = "30.0.2"

    ext.kotlin_version = "1.4.10"
    ext.kotlin_coroutines_version = "1.3.9"
    ext.google_services_version = "4.3.3"
    ext.nav_component_version = "2.3.0"
    ext.lifecycle_version = "2.2.0"
    ext.paging_version = "3.0.0-alpha06"
    ext.room_version = "2.3.0-alpha02"
    ext.kotlinx_serialization_version = "1.0.0-RC"
    ext.kodein_version = "7.0.0"
    ext.preference_version = "1.1.1"
    ext.material_version = "1.3.0-alpha02"
    ext.glide_version = "4.11.0"
    ext.appcompat_version = "1.2.0"
    ext.core_version = "1.3.1"
    ext.connectycube_version = '1.9.2'
    ext.gson_version = "2.8.6"

    repositories {
        google()
        mavenCentral()
        jcenter()
        maven { url "https://github.com/ConnectyCube/connectycube-android-sdk-releases/raw/master/" }
    }

    dependencies {
        classpath 'com.android.tools.build:gradle:4.1.0-rc03'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
        classpath "com.google.gms:google-services:$google_services_version"
        classpath "androidx.navigation:navigation-safe-args-gradle-plugin:$nav_component_version"
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
        jcenter()
        maven { url "https://github.com/ConnectyCube/connectycube-android-sdk-releases/raw/master/" }
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}